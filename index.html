<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreetSketch has moved</title>
<link rel="canonical" href="https://streetcanvas.pages.dev/">
<meta name="robots" content="noindex">
<!-- GitHub Pages cannot send a real 301, so: meta refresh for no-JS, location.replace below for everyone else. -->
<meta http-equiv="refresh" content="0; url=https://streetcanvas.pages.dev/">
<style>
  :root { color-scheme: light dark; --bg:#f6f4ef; --fg:#20262b; --muted:#6b7378; --line:#d3d8dd; --accent:#07864f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1214; --fg:#e8ecef; --muted:#9aa3ab; --line:#2a3036; --accent:#3fbf7a; } }
  html,body { height:100%; }
  body { margin:0; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--fg);
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width:30rem; text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 1.5rem; }
  a.go { display:inline-block; padding:.7rem 1.1rem; border:1px solid var(--line); border-radius:.6rem;
         background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  a.go:hover { filter:brightness(1.06); }
  code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.9em; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>StreetSketch has moved</h1>
  <p>This test site is retired. The tool now lives at its own address, and this page is only here so old links still reach it.</p>
  <p><a class="go" href="https://streetcanvas.pages.dev/">Open StreetSketch</a></p>
  <p><code>streetcanvas.pages.dev</code></p>
</main>
<script>
  // keep any query string or hash (e.g. ?no3d, ?look=sky) so a deep link still does what it said
  location.replace('https://streetcanvas.pages.dev/' + location.search + location.hash);
</script>
</body>
</html>
